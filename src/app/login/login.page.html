<ion-content fullscreen>
  <!-- Imagen superior -->
  <div class="top-image">
    <img src="assets/ciudad2.jpg" alt="Fondo" />
  </div>

  <!-- Contenedor de login -->
  <div class="login-section ion-padding">
    <div class="heading ion-padding">
      <h1>Welcome Tú ciudad limpia!</h1>
      <p>Inicia sesión para continuar</p>
    </div>

    <div class="login-form ion-padding">
      <!-- Correo -->
      <div class="form-input">
        <ion-item lines="full">
          <ion-icon name="mail-outline" slot="start"></ion-icon>
          <ion-input
            type="email"
            name="correo"
            label="Correo"
            label-placement="floating"
            placeholder="Ingresa tu correo"
            required
          ></ion-input>
        </ion-item>
      </div>

      <!-- Contraseña -->
      <div class="form-input">
        <ion-item lines="full">
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          <ion-input
            type="password"
            name="contraseña"
            label="Contraseña"
            label-placement="floating"
            placeholder="Ingresa tu contraseña"
            required
          ></ion-input>
        </ion-item>
      </div>
    </div>

    <!-- Botones -->
    <div class="action-buttons ion-padding">
      <ion-button expand="block" class="login-button" (click)="login()">Iniciar sesión</ion-button>
      <p class="forgot">¿Olvidaste tu contraseña?</p>
      <ion-button
        expand="block"
        fill="outline"
        class="signup-button"
        routerLink="/registrar-usuario"
      >
        Registrarse
      </ion-button>
    </div>
  </div>
</ion-content>
